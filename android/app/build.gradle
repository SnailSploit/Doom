apply plugin: 'com.android.application'

android {
    namespace 'com.magicalworld.ben'
    compileSdk 34

    defaultConfig {
        applicationId "com.magicalworld.ben"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Intentionally no androidx dependencies: this is a bare framework WebView
    // Activity, so there are no AppCompat/emoji2/startup initializer providers to
    // run (or fail) at launch. Keeps the app tiny and the startup path minimal.
}
