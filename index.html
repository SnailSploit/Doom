function generateWallTexture(baseR, baseG, baseB, style) {
  const size = 32;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const tx = c.getContext('2d');

  tx.fillStyle = `rgb(${baseR},${baseG},${baseB})`;
  tx.fillRect(0, 0, size, size);

  if (style === 'brick') {
    tx.fillStyle = `rgb(${Math.max(0,baseR-30)},${Math.max(0,baseG-20)},${Math.max(0,baseB-15)})`;
    for (let row = 0; row < 4; row++) {
      const y = row * 8;
      tx.fillRect(0, y, size, 1);
      const offset = (row % 2) * 16;
      tx.fillRect(offset, y, 1, 8);
      tx.fillRect(offset + 16, y, 1, 8);
    }
    for (let i = 0; i < 40; i++) {
      const nx = Math.floor(Math.random() * size);
      const ny = Math.floor(Math.random() * size);
      const v = Math.floor(Math.random() * 20 - 10);
      tx.fillStyle = `rgba(${v > 0 ? 255 : 0},${v > 0 ? 255 : 0},${v > 0 ? 255 : 0},${Math.abs(v) / 80})`;
      tx.fillRect(nx, ny, 1, 1);
    }
  } else if (style === 'stone') {
    for (let i = 0; i < 60; i++) {
      const nx = Math.floor(Math.random() * size);
      const ny = Math.floor(Math.random() * size);
      const v = Math.floor(Math.random() * 30 - 15);
      tx.fillStyle = `rgba(${v > 0 ? 200 : 0},${v > 0 ? 200 : 0},${v > 0 ? 200 : 0},${Math.abs(v) / 50})`;
      tx.fillRect(nx, ny, 1 + Math.floor(Math.random() * 2), 1);
    }
    tx.fillStyle = `rgba(0,0,0,0.15)`;
    for (let i = 0; i < 3; i++) {
      const cy = Math.floor(Math.random() * size);
      tx.fillRect(0, cy, size, 1);
    }
  } else if (style === 'flesh') {
    for (let i = 0; i < 80; i++) {
      const nx = Math.floor(Math.random() * size);
      const ny = Math.floor(Math.random() * size);
      const r = Math.min(255, baseR + Math.floor(Math.random() * 40 - 20));
      const g = Math.max(0, baseG + Math.floor(Math.random() * 10 - 15));
      const b = Math.max(0, baseB + Math.floor(Math.random() * 10 - 15));
      tx.fillStyle = `rgb(${r},${g},${b})`;
      tx.fillRect(nx, ny, 1, 1);
    }
    tx.fillStyle = 'rgba(80,0,0,0.3)';
    tx.fillRect(Math.floor(Math.random() * 20) + 5, Math.floor(Math.random() * 20) + 5, 3, 5);
  } else if (style === 'tech') {
    tx.strokeStyle = `rgba(${Math.min(255,baseR+40)},${Math.min(255,baseG+40)},${Math.min(255,baseB+40)},0.3)`;
    tx.lineWidth = 1;
    tx.strokeRect(2, 2, size - 4, size - 4);
    tx.fillStyle = `rgba(${Math.min(255,baseR+60)},${Math.min(255,baseG+60)},${Math.min(255,baseB+60)},0.2)`;
    tx.fillRect(4, 4, 4, 4);
    tx.fillRect(size - 8, size - 8, 4, 4);
    for (let i = 0; i < 20; i++) {
      const nx = Math.floor(Math.random() * size);
      const ny = Math.floor(Math.random() * size);
      tx.fillStyle = `rgba(0,0,0,${Math.random() * 0.1})`;
      tx.fillRect(nx, ny, 1, 1);
    }
  } else if (style === 'hell') {
    for (let i = 0; i < 50; i++) {
      const nx = Math.floor(Math.random() * size);
      const ny = Math.floor(Math.random() * size);
      const glow = Math.random();
      if (glow > 0.9) {
        tx.fillStyle = `rgba(255,${Math.floor(Math.random()*100)},0,${0.3 + Math.random() * 0.3})`;
        tx.fillRect(nx, ny, 1 + Math.floor(Math.random() * 2), 1 + Math.floor(Math.random() * 2));
      } else {
        tx.fillStyle = `rgba(0,0,0,${Math.random() * 0.15})`;
        tx.fillRect(nx, ny, 1, 1);
      }
    }
  }
  return c;
}

function castRay(ox, oy, angle) {
  const sin = Math.sin(angle);
  const cos = Math.cos(angle);
  const grid = LEVELS[currentLevel].grid;
  const mapH = grid.length;
  const mapW = grid[0].length;
  let mapX = Math.floor(ox);
  let mapY = Math.floor(oy);
  const deltaDistX = Math.abs(1 / (cos || 1e-10));
  const deltaDistY = Math.abs(1 / (sin || 1e-10));
  let stepX, stepY, sideDistX, sideDistY;
  if (cos < 0) { stepX = -1; sideDistX = (ox - mapX) * deltaDistX; }
  else { stepX = 1; sideDistX = (mapX + 1 - ox) * deltaDistX; }
  if (sin < 0) { stepY = -1; sideDistY = (oy - mapY) * deltaDistY; }
  else { stepY = 1; sideDistY = (mapY + 1 - oy) * deltaDistY; }
  let side = 0, hit = 0;
  for (let i = 0; i < 64; i++) {
    if (sideDistX < sideDistY) { sideDistX += deltaDistX; mapX += stepX; side = 0; }
    else { sideDistY += deltaDistY; mapY += stepY; side = 1; }
    if (mapX < 0 || mapX >= mapW || mapY < 0 || mapY >= mapH) break;
    if (grid[mapY][mapX] > 0) { hit = grid[mapY][mapX]; break; }
  }
  let dist;
  if (hit) { dist = side === 0 ? sideDistX - deltaDistX : sideDistY - deltaDistY; }
  else { dist = 64; }
  let wallX = side === 0 ? oy + dist * sin : ox + dist * cos;
  wallX -= Math.floor(wallX);
  return { dist, side, hit, wallX, mapX, mapY };
}

function isWall(x, y) {
  const grid = LEVELS[currentLevel].grid;
  const gx = Math.floor(x), gy = Math.floor(y);
  if (gx < 0 || gx >= grid[0].length || gy < 0 || gy >= grid.length) return true;
  return grid[gy][gx] > 0;
}

function canSee(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const steps = Math.ceil(dist * 5);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (isWall(x1 + dx * t, y1 + dy * t)) return false;
  }
  return true;
}

let touchL = null, touchR = null;
let touchLStart = { x: 0, y: 0 };
let touchRStart = { x: 0, y: 0 };
let touchRPrev = { x: 0, y: 0 };
let moveInput = { x: 0, y: 0 };
let lookDelta = 0;
let shootRequested = false;
let shootHeld = false;
let touchRMoved = false;

const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function handleTouchStart(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.clientX < W * 0.4) {
      touchL = t.identifier;
      touchLStart = { x: t.clientX, y: t.clientY };
      moveInput = { x: 0, y: 0 };
    } else {
      touchR = t.identifier;
      touchRStart = { x: t.clientX, y: t.clientY };
      touchRPrev = { x: t.clientX, y: t.clientY };
      touchRMoved = false;
      shootHeld = true;
    }
  }
}

function handleTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touchL) {
      const dx = t.clientX - touchLStart.x;
      const dy = t.clientY - touchLStart.y;
      const maxR = 50;
      moveInput.x = Math.max(-1, Math.min(1, dx / maxR));
      moveInput.y = Math.max(-1, Math.min(1, dy / maxR));
    }
    if (t.identifier === touchR) {
      const dx = t.clientX - touchRPrev.x;
      touchRPrev = { x: t.clientX, y: t.clientY };
      lookDelta += dx;
      const totalMove = Math.abs(t.clientX - touchRStart.x) + Math.abs(t.clientY - touchRStart.y);
      if (totalMove > 15) touchRMoved = true;
    }
  }
}

function handleTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touchL) { touchL = null; moveInput = { x: 0, y: 0 }; }
    if (t.identifier === touchR) {
      if (!touchRMoved) shootRequested = true;
      touchR = null;
      shootHeld = false;
    }
  }
}

canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

function handleOverlayTap() {
  if (gameState === STATES.TITLE) {
    initAudio();
    currentLevel = 0;
    gameState = STATES.BRIEFING;
    showOverlay('briefing');
  } else if (gameState === STATES.BRIEFING) {
    resetGame();
    gameState = STATES.PLAYING;
    overlay.classList.add('hidden');
    playSound('door');
  } else if (gameState === STATES.GAME_OVER) {
    gameState = STATES.BRIEFING;
    showOverlay('briefing');
  } else if (gameState === STATES.LEVEL_COMPLETE) {
    currentLevel++;
    if (currentLevel >= LEVELS.length) {
      gameState = STATES.WIN;
      showOverlay('win');
    } else {
      gameState = STATES.BRIEFING;
      showOverlay('briefing');
    }
  } else if (gameState === STATES.WIN) {
    gameState = STATES.TITLE;
    showOverlay('title');
  }
}

let audioCtx = null;
let ambientNode = null;
let ambientGain = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    startAmbient();
  } catch(e) {}
}

function startAmbient() {
  if (!audioCtx) return;
  try {
    ambientGain = audioCtx.createGain();
    ambientGain.gain.value = 0.04;
    ambientGain.connect(audioCtx.destination);

    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 4, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    let val = 0;
    for (let i = 0; i < data.length; i++) {
      val += (Math.random() * 2 - 1) * 0.02;
      val *= 0.998;
      data[i] = val + Math.sin(i / audioCtx.sampleRate * 30) * 0.1 + Math.sin(i / audioCtx.sampleRate * 47) * 0.05;
    }
    ambientNode = audioCtx.createBufferSource();
    ambientNode.buffer = buf;
    ambientNode.loop = true;

    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 200;
    ambientNode.connect(lp).connect(ambientGain);
    ambientNode.start();
  } catch(e) {}
}

function playSound(type, volume) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const v = volume || 1.0;
    const master = audioCtx.createGain();
    master.gain.value = 0.18 * v;
    master.connect(audioCtx.destination);

    if (type === 'pistol') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(350, now);
      o.frequency.exponentialRampToValueAtTime(40, now + 0.12);
      g.gain.setValueAtTime(0.6, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      o.connect(g).connect(master);
      o.start(now); o.stop(now + 0.12);
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.5);
      const n = audioCtx.createBufferSource(); n.buffer = buf;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.4, now); ng.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      n.connect(ng).connect(master); n.start(now); n.stop(now + 0.1);
    } else if (type === 'shotgun') {
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 0.4) * 1.2;
      const n = audioCtx.createBufferSource(); n.buffer = buf;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.8, now); ng.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      n.connect(ng).connect(master); n.start(now); n.stop(now + 0.3);
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(250, now); o.frequency.exponentialRampToValueAtTime(25, now + 0.2);
      g.gain.setValueAtTime(0.5, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      o.connect(g).connect(master); o.start(now); o.stop(now + 0.2);
      const o2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      o2.type = 'square';
      o2.frequency.setValueAtTime(100, now); o2.frequency.exponentialRampToValueAtTime(20, now + 0.15);
      g2.gain.setValueAtTime(0.3, now); g2.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      o2.connect(g2).connect(master); o2.start(now); o2.stop(now + 0.15);
    } else if (type === 'plasma') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(900, now); o.frequency.exponentialRampToValueAtTime(150, now + 0.18);
      g.gain.setValueAtTime(0.35, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      o.connect(g).connect(master); o.start(now); o.stop(now + 0.18);
      const o2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      o2.type = 'square'; o2.frequency.setValueAtTime(1400, now); o2.frequency.exponentialRampToValueAtTime(300, now + 0.12);
      g2.gain.setValueAtTime(0.15, now); g2.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      o2.connect(g2).connect(master); o2.start(now); o2.stop(now + 0.12);
    } else if (type === 'hit') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(180, now); o.frequency.exponentialRampToValueAtTime(40, now + 0.06);
      g.gain.setValueAtTime(0.4, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
      o.connect(g).connect(master); o.start(now); o.stop(now + 0.06);
    } else if (type === 'enemy_die') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(500, now); o.frequency.exponentialRampToValueAtTime(20, now + 0.5);
      g.gain.setValueAtTime(0.5, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      o.connect(g).connect(master); o.start(now); o.stop(now + 0.5);
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 0.5) * 0.5;
      const n = audioCtx.createBufferSource(); n.buffer = buf;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.3, now); ng.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      n.connect(ng).connect(master); n.start(now); n.stop(now + 0.3);
    } else if (type === 'pickup') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(440, now); o.frequency.setValueAtTime(554, now + 0.06); o.frequency.setValueAtTime(659, now + 0.12);
      g.gain.setValueAtTime(0.25, now); g.gain.setValueAtTime(0.25, now + 0.15); g.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      o.connect(g).connect(master); o.start(now); o.stop(now + 0.25);
    } else if (type === 'pain') {
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.15, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 0.8);
      const n = audioCtx.createBufferSource(); n.buffer = buf;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.4, now); ng.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      n.connect(ng).connect(master); n.start(now); n.stop(now + 0.15);
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(250, now); o.frequency.exponentialRampToValueAtTime(60, now + 0.12);
      g.gain.setValueAtTime(0.3, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      o.connect(g).connect(master); o.start(now); o.stop(now + 0.12);
    } else if (type === 'door') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(60, now); o.frequency.linearRampToValueAtTime(100, now + 0.5);
      g.gain.setValueAtTime(0.25, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      o.connect(g).connect(master); o.start(now); o.stop(now + 0.5);
    } else if (type === 'explode') {
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.5, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 0.25);
      const n = audioCtx.createBufferSource(); n.buffer = buf;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.7, now); ng.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      n.connect(ng).connect(master); n.start(now); n.stop(now + 0.5);
    } else if (type === 'growl') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(80 + Math.random() * 40, now); o.frequency.linearRampToValueAtTime(60 + Math.random() * 30, now + 0.3);
      g.gain.setValueAtTime(0.12, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
      o.connect(g).connect(lp).connect(master); o.start(now); o.stop(now + 0.3);
    } else if (type === 'step') {
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      const n = audioCtx.createBufferSource(); n.buffer = buf;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.08, now); ng.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
      n.connect(ng).connect(lp).connect(master); n.start(now); n.stop(now + 0.05);
    } else if (type === 'heartbeat') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 50;
      g.gain.setValueAtTime(0.4, now); g.gain.setValueAtTime(0.01, now + 0.08);
      g.gain.setValueAtTime(0.25, now + 0.15); g.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      o.connect(g).connect(master); o.start(now); o.stop(now + 0.3);
    }
  } catch(e) {}
}

function addNotification(text, color, duration) {
  notifications.push({ text, color: color || '#FF4444', life: duration || 2.0, maxLife: duration || 2.0 });
  if (notifications.length > 5) notifications.shift();
}

function spawnParticles(x, y, color, count, spread, grav) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * spread,
      vy: (Math.random() - 0.5) * spread,
      life: 0.3 + Math.random() * 0.5,
      maxLife: 0.3 + Math.random() * 0.5,
      color,
      size: 0.04 + Math.random() * 0.12,
      gravity: grav || 0,
    });
    if (particles.length > 300) particles.shift();
  }
}

function spawnBlood(x, y) {
  bloodDecals.push({ x, y, size: 0.2 + Math.random() * 0.3, alpha: 0.7 + Math.random() * 0.3 });
  if (bloodDecals.length > 30) bloodDecals.shift();
}

function fireWeapon() {
  const weapon = WEAPONS[player.currentWeapon];
  if (player.fireTimer > 0) return;
  if (player.ammo[weapon.ammoType] < weapon.ammoPerShot) return;

  player.ammo[weapon.ammoType] -= weapon.ammoPerShot;
  player.fireTimer = weapon.fireRate;
  weaponKick = weapon.kickForce;
  muzzleFlash = 0.12;
  screenShake = weapon.shakeForce;

  const soundNames = ['pistol', 'shotgun', 'plasma'];
  playSound(soundNames[player.currentWeapon]);

  const pellets = weapon.pellets || 1;
  for (let p = 0; p < pellets; p++) {
    const angle = player.angle + (Math.random() - 0.5) * weapon.spread;
    const cos = Math.cos(angle), sin = Math.sin(angle);
    let closestEnemy = null, closestDist = 64;

    for (const enemy of enemies) {
      if (!enemy.active || enemy.state === 'dead') continue;
      const dx = enemy.x - player.x, dy = enemy.y - player.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const enemyAngle = Math.atan2(dy, dx);
      let angleDiff = enemyAngle - angle;
      while (angleDiff > Math.PI) angleDiff -= TWO_PI;
      while (angleDiff < -Math.PI) angleDiff += TWO_PI;
      const hitWidth = enemy.size / dist;
      if (Math.abs(angleDiff) < hitWidth && dist < closestDist) {
        if (canSee(player.x, player.y, enemy.x, enemy.y)) {
          closestEnemy = enemy;
          closestDist = dist;
        }
      }
    }

    if (closestEnemy) {
      closestEnemy.health -= weapon.damage;
      closestEnemy.painTimer = 0.12;
      if (closestEnemy.state === 'idle') {
        closestEnemy.state = 'chase';
        closestEnemy.alertTimer = 0.3;
      }
      playSound('hit');
      spawnParticles(closestEnemy.x, closestEnemy.y, '#CC0000', 4, 1.5, 0.5);
      spawnParticles(closestEnemy.x, closestEnemy.y, '#880000', 3, 1, 0.3);

      if (closestEnemy.health <= 0) {
        closestEnemy.state = 'dead';
        closestEnemy.deathTimer = 2.0;
        kills++;
        killStreak++;
        killStreakTimer = 3.0;
        playSound('enemy_die');
        spawnParticles(closestEnemy.x, closestEnemy.y, '#AA0000', 20, 3, 1);
        spawnParticles(closestEnemy.x, closestEnemy.y, '#660000', 10, 2, 0.5);
        spawnBlood(closestEnemy.x, closestEnemy.y);
        screenShake = 0.2;
        addNotification(closestEnemy.deathMsg, '#FF4444', 1.5);
        if (killStreak >= 2 && killStreak < STREAK_MSGS.length) {
          addNotification(STREAK_MSGS[killStreak], '#FFD700', 2.0);
        }
        for (const other of enemies) {
          if (!other.active || other.state !== 'idle') continue;
          const d = Math.sqrt((other.x - closestEnemy.x) ** 2 + (other.y - closestEnemy.y) ** 2);
          if (d < 6) { other.state = 'chase'; other.alertTimer = 0.2 + Math.random() * 0.3; }
        }
      }
    } else {
      const hitDist = castRay(player.x, player.y, angle).dist;
      const hx = player.x + cos * hitDist * 0.95;
      const hy = player.y + sin * hitDist * 0.95;
      spawnParticles(hx, hy, '#FFAA44', 2, 0.8);
    }
  }
}

function update(dt) {
  if (gameState !== STATES.PLAYING) return;
  gameTime += dt;

  flickerTimer += dt;
  if (flickerTimer > 0.1 + Math.random() * 0.3) {
    flickerTimer = 0;
    flickerIntensity = 0.92 + Math.random() * 0.08;
    if (Math.random() < 0.02) flickerIntensity = 0.6 + Math.random() * 0.2;
  }
  ambientPulse += dt * 0.5;

  let moveX = 0, moveY = 0, rot = 0;
  if (keys['w'] || keys['arrowup']) moveY = -1;
  if (keys['s'] || keys['arrowdown']) moveY = 1;
  if (keys['a']) moveX = -1;
  if (keys['d']) moveX = 1;
  if (keys['arrowleft']) rot = -1;
  if (keys['arrowright']) rot = 1;
  if (keys[' '] || keys['f']) shootRequested = true;
  if (keys['1']) switchWeapon(0);
  if (keys['2']) switchWeapon(1);
  if (keys['3']) switchWeapon(2);

  moveX += moveInput.x;
  moveY += moveInput.y;
  player.angle += lookDelta * 0.003;
  lookDelta = 0;
  player.angle += rot * player.rotSpeed * dt;

  const cos = Math.cos(player.angle), sin = Math.sin(player.angle);
  const speed = player.speed * dt;
  const dx = (cos * -moveY + sin * moveX) * speed;
  const dy = (sin * -moveY - cos * moveX) * speed;

  const RADIUS = 0.25;
  if (!isWall(player.x + dx + RADIUS * Math.sign(dx), player.y)) player.x += dx;
  if (!isWall(player.x, player.y + dy + RADIUS * Math.sign(dy))) player.y += dy;

  const isMoving = Math.abs(dx) + Math.abs(dy) > 0.001;
  if (isMoving) {
    headBob += dt * 9;
    headBobIntensity = Math.min(1, headBobIntensity + dt * 5);
    weaponBob += dt * 9;
    stepTimer += dt;
    if (stepTimer > 0.35) { stepTimer = 0; playSound('step'); }
  } else {
    headBobIntensity = Math.max(0, headBobIntensity - dt * 3);
    stepTimer = 0.3;
  }

  if (player.fireTimer > 0) player.fireTimer -= dt;
  if ((shootRequested || shootHeld) && player.fireTimer <= 0) fireWeapon();
  shootRequested = false;

  weaponKick *= Math.pow(0.0005, dt);
  if (weaponKick < 0.01) weaponKick = 0;
  muzzleFlash -= dt * 3;
  if (muzzleFlash < 0) muzzleFlash = 0;
  screenShake *= Math.pow(0.0005, dt);
  damageFlash -= dt * 2.5;
  if (damageFlash < 0) damageFlash = 0;
  pickupFlash -= dt * 4;
  if (pickupFlash < 0) pickupFlash = 0;

  if (killStreakTimer > 0) { killStreakTimer -= dt; }
  else { killStreak = 0; }

  if (player.health <= 30 && player.health > 0) {
    heartbeatTimer += dt;
    const rate = player.health <= 15 ? 0.6 : 0.9;
    if (heartbeatTimer >= rate) {
      heartbeatTimer = 0;
      heartbeatPhase = 1.0;
      playSound('heartbeat');
    }
    heartbeatPhase *= Math.pow(0.01, dt);
  } else {
    heartbeatPhase = 0;
  }

  for (const enemy of enemies) {
    if (!enemy.active) continue;
    enemy.animPhase += dt * 3;

    if (enemy.state === 'dead') {
      enemy.deathTimer -= dt;
      if (enemy.deathTimer <= 0) enemy.active = false;
      continue;
    }

    if (enemy.painTimer > 0) { enemy.painTimer -= dt; continue; }

    const edx = player.x - enemy.x, edy = player.y - enemy.y;
    const dist = Math.sqrt(edx * edx + edy * edy);

    if (enemy.state === 'idle') {
      if (dist < 10 && canSee(enemy.x, enemy.y, player.x, player.y)) {
        enemy.state = 'chase';
        enemy.alertTimer = 0.3 + Math.random() * 0.2;
        playSound('growl', Math.max(0.2, 1 - dist / 10));
      }
    }

    if (enemy.state === 'chase') {
      if (enemy.alertTimer > 0) { enemy.alertTimer -= dt; continue; }

      if (dist > enemy.attackRange || !canSee(enemy.x, enemy.y, player.x, player.y)) {
        const angle = Math.atan2(edy, edx);
        const moveSpeed = enemy.speed * dt;
        let newX = enemy.x + Math.cos(angle) * moveSpeed;
        let newY = enemy.y + Math.sin(angle) * moveSpeed;
        if (isWall(newX, enemy.y)) { newX = enemy.x; newY = enemy.y + Math.sign(edy) * moveSpeed; }
        if (isWall(enemy.x, newY)) { newY = enemy.y; newX = enemy.x + Math.sign(edx) * moveSpeed; }
        if (!isWall(newX, newY)) { enemy.x = newX; enemy.y = newY; }
      }

      enemy.attackTimer -= dt;
      if (dist <= enemy.attackRange && enemy.attackTimer <= 0 && canSee(enemy.x, enemy.y, player.x, player.y)) {
        enemy.attackTimer = enemy.attackCooldown;
        let dmg = enemy.damage;
        let didHit = false;

        if (enemy.melee) {
          if (dist < 1.5) didHit = true;
        } else {
          const hitChance = Math.max(0.25, 1.0 - dist / 14);
          if (Math.random() < hitChance) didHit = true;
          spawnParticles(enemy.x, enemy.y, enemy.eyeColor, 3, 2);
        }

        if (didHit) {
          if (player.armor > 0) {
            const absorbed = Math.min(player.armor, Math.floor(dmg * 0.6));
            player.armor -= absorbed;
            dmg -= absorbed;
          }
          player.health -= dmg;
          damageFlash = 1.0;
          screenShake = 0.12;
          damageDir = Math.atan2(enemy.y - player.y, enemy.x - player.x) - player.angle;
          playSound('pain');
        }
      }
    }
  }

  for (const pickup of pickups) {
    if (!pickup.active) continue;
    pickup.bobPhase += dt * 3;
    const pdx = player.x - pickup.x, pdy = player.y - pickup.y;
    if (Math.sqrt(pdx * pdx + pdy * pdy) < 0.6) {
      let taken = false;
      switch (pickup.type) {
        case 'health': if (player.health < 100) { player.health = Math.min(100, player.health + 25); taken = true; } break;
        case 'megahealth': player.health = Math.min(200, player.health + 100); taken = true; break;
        case 'armor': if (player.armor < 100) { player.armor = Math.min(100, player.armor + 50); taken = true; } break;
        case 'ammo_bullets': if (player.ammo.bullets < 200) { player.ammo.bullets = Math.min(200, player.ammo.bullets + 20); taken = true; } break;
        case 'ammo_shells': if (player.ammo.shells < 50) { player.ammo.shells = Math.min(50, player.ammo.shells + 8); taken = true; } break;
        case 'ammo_cells': if (player.ammo.cells < 300) { player.ammo.cells = Math.min(300, player.ammo.cells + 40); taken = true; } break;
        case 'shotgun':
          if (!player.weapons[1]) { player.weapons[1] = true; player.ammo.shells = Math.min(50, player.ammo.shells + 8); taken = true; addNotification('SHOTGUN ACQUIRED', '#FFAA00', 2); }
          else if (player.ammo.shells < 50) { player.ammo.shells = Math.min(50, player.ammo.shells + 8); taken = true; }
          break;
        case 'plasma':
          if (!player.weapons[2]) { player.weapons[2] = true; player.ammo.cells = Math.min(300, player.ammo.cells + 40); taken = true; addNotification('PLASMA GUN ACQUIRED', '#00CCFF', 2); }
          else if (player.ammo.cells < 300) { player.ammo.cells = Math.min(300, player.ammo.cells + 40); taken = true; }
          break;
      }
      if (taken) { pickup.active = false; pickupFlash = 0.4; playSound('pickup'); }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.gravity) p.vy += p.gravity * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = notifications.length - 1; i >= 0; i--) {
    notifications[i].life -= dt;
    if (notifications[i].life <= 0) notifications.splice(i, 1);
  }

  if (player.health <= 0) {
    player.health = 0;
    gameState = STATES.GAME_OVER;
    playSound('explode');
    setTimeout(() => showOverlay('gameover'), 800);
    return;
  }

  const exitDef = LEVELS[currentLevel].exit;
  if (exitDef) {
    const edx = player.x - (exitDef.x + 0.5), edy = player.y - (exitDef.y + 0.5);
    if (Math.sqrt(edx * edx + edy * edy) < 0.8) {
      gameState = STATES.LEVEL_COMPLETE;
      showOverlay('levelcomplete');
      playSound('pickup');
    }
  }
}

function switchWeapon(idx) {
  if (player.weapons[idx] && player.currentWeapon !== idx) {
    player.currentWeapon = idx;
    weaponKick = 0.5;
  }
}

function render() {
  resize();
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, RW, RH);

  if (gameState !== STATES.PLAYING && gameState !== STATES.GAME_OVER) return;

  const shakeX = (Math.random() - 0.5) * screenShake * 12;
  const shakeY = (Math.random() - 0.5) * screenShake * 12;
  const bobY = Math.sin(headBob) * 1.5 * headBobIntensity;
  const bobX = Math.cos(headBob * 0.5) * 0.8 * headBobIntensity;

  const halfH = RH / 2;
  const lvl = LEVELS[currentLevel];
  const amb = lvl.ambientColor;
  const fogDist = lvl.fogDensity;

  const heartPulse = heartbeatPhase * 0.15;

  const ceilR = Math.floor(amb.r * 0.8 * flickerIntensity);
  const ceilG = Math.floor(amb.g * 0.6 * flickerIntensity);
  const ceilB = Math.floor(amb.b * 0.5 * flickerIntensity);
  const ceilGrad = ctx.createLinearGradient(0, 0, 0, halfH);
  ceilGrad.addColorStop(0, `rgb(${Math.floor(ceilR*0.3)},${Math.floor(ceilG*0.3)},${Math.floor(ceilB*0.3)})`);
  ceilGrad.addColorStop(1, `rgb(${ceilR},${ceilG},${ceilB})`);
  ctx.fillStyle = ceilGrad;
  ctx.fillRect(0, 0, RW, halfH + bobY + shakeY);

  const floorGrad = ctx.createLinearGradient(0, halfH, 0, RH);
  floorGrad.addColorStop(0, `rgb(${Math.floor(amb.r*1.2)},${Math.floor(amb.g*1.1)},${Math.floor(amb.b*1.0)})`);
  floorGrad.addColorStop(1, `rgb(${Math.floor(amb.r*0.4)},${Math.floor(amb.g*0.3)},${Math.floor(amb.b*0.3)})`);
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, halfH + bobY + shakeY, RW, halfH);

  const numRays = RW;
  const sprites = [];

  for (let i = 0; i < numRays; i++) {
    const rayAngle = player.angle - FOV / 2 + (i / numRays) * FOV;
    const result = castRay(player.x, player.y, rayAngle);
    const perpDist = result.dist * Math.cos(rayAngle - player.angle);
    zBuffer[i] = perpDist;

    if (result.hit > 0) {
      const lineHeight = Math.floor(RH / perpDist);
      const drawStart = Math.floor(halfH - lineHeight / 2 + bobY + shakeY);
      const colors = WALL_COLORS[result.hit] || WALL_COLORS[1];
      const wallColor = result.side === 1 ? colors.dark : colors.main;
      const shade = Math.max(0.08, (1.0 - perpDist / fogDist)) * flickerIntensity;

      const tex = wallTextures[result.hit];
      if (tex && lineHeight > 4) {
        const texX = Math.floor(result.wallX * 32);
        ctx.drawImage(tex, texX, 0, 1, 32, Math.floor(i + shakeX + bobX), drawStart, 1, lineHeight);
        ctx.fillStyle = `rgba(0,0,0,${1 - shade})`;
        ctx.fillRect(Math.floor(i + shakeX + bobX), drawStart, 1, lineHeight);
        if (result.side === 1) {
          ctx.fillStyle = 'rgba(0,0,0,0.2)';
          ctx.fillRect(Math.floor(i + shakeX + bobX), drawStart, 1, lineHeight);
        }
      } else {
        ctx.fillStyle = shadeColor(wallColor, shade);
        ctx.fillRect(Math.floor(i + shakeX + bobX), drawStart, 1, lineHeight);
      }
    }
  }

  for (const d of bloodDecals) {
    sprites.push({ x: d.x, y: d.y, type: 'blood', data: d });
  }
  for (const enemy of enemies) {
    if (!enemy.active) continue;
    sprites.push({ x: enemy.x, y: enemy.y, type: 'enemy', data: enemy });
  }
  for (const pickup of pickups) {
    if (!pickup.active) continue;
    sprites.push({ x: pickup.x, y: pickup.y, type: 'pickup', data: pickup });
  }
  for (const particle of particles) {
    sprites.push({ x: particle.x, y: particle.y, type: 'particle', data: particle });
  }
  const exitDef = lvl.exit;
  if (exitDef) sprites.push({ x: exitDef.x + 0.5, y: exitDef.y + 0.5, type: 'exit', data: exitDef });

  for (const s of sprites) {
    const sdx = s.x - player.x, sdy = s.y - player.y;
    s.dist = Math.sqrt(sdx * sdx + sdy * sdy);
    s.angle = Math.atan2(sdy, sdx);
  }
  sprites.sort((a, b) => b.dist - a.dist);

  for (const s of sprites) {
    let angleDiff = s.angle - player.angle;
    while (angleDiff > Math.PI) angleDiff -= TWO_PI;
    while (angleDiff < -Math.PI) angleDiff += TWO_PI;
    if (Math.abs(angleDiff) > FOV * 0.7) continue;

    const screenX = Math.floor(RW / 2 + (angleDiff / FOV) * RW) + shakeX + bobX;
    const shade = Math.max(0.1, (1.0 - s.dist / fogDist)) * flickerIntensity;

    if (s.type === 'blood') {
      if (s.dist < 0.5 || s.dist > fogDist) continue;
      const sz = Math.floor(RH / s.dist * s.data.size * 0.3);
      if (sz < 1) continue;
      const sy = halfH + sz * 0.5 + bobY + shakeY;
      const stCol = Math.floor(screenX - sz / 2);
      for (let col = stCol; col < stCol + sz; col++) {
        if (col < 0 || col >= RW || s.dist >= zBuffer[col]) continue;
        ctx.fillStyle = `rgba(80,0,0,${s.data.alpha * shade * 0.5})`;
        ctx.fillRect(col, sy, 1, Math.max(1, sz * 0.3));
      }
      continue;
    }

    if (s.type === 'particle') {
      const p = s.data;
      if (s.dist < 0.2) continue;
      const size = Math.floor((p.size * RH) / s.dist);
      if (size < 1) continue;
      ctx.globalAlpha = (p.life / p.maxLife) * shade;
      ctx.fillStyle = p.color;
      ctx.fillRect(screenX - size / 2, halfH + bobY + shakeY - size / 2, size, size);
      ctx.globalAlpha = 1;
      continue;
    }

    if (s.type === 'exit') {
      const spriteSize = Math.floor(RH / s.dist * 0.5);
      if (spriteSize < 2) continue;
      const screenY = halfH - spriteSize / 2 + bobY + shakeY;
      const pulse = 0.4 + 0.4 * Math.sin(gameTime * 4);
      const stCol = Math.floor(screenX - spriteSize / 2);
      const enCol = Math.floor(screenX + spriteSize / 2);
      for (let col = stCol; col < enCol; col++) {
        if (col < 0 || col >= RW || s.dist >= zBuffer[col]) continue;
        const lx = Math.abs((col - stCol) / spriteSize - 0.5) * 2;
        if (lx > 0.6) { ctx.fillStyle = `rgba(0,180,60,${(0.15 + pulse * 0.1) * shade})`; }
        else { ctx.fillStyle = `rgba(0,255,100,${(0.3 + pulse * 0.4) * shade})`; }
        ctx.fillRect(col, screenY, 1, spriteSize);
      }
      continue;
    }

    if (s.dist < 0.3) continue;

    if (s.type === 'enemy') {
      const enemy = s.data;
      const spriteSize = Math.floor(RH / s.dist * enemy.size);
      if (spriteSize < 2) continue;
      const screenY = halfH - spriteSize / 2 + bobY + shakeY;
      const stCol = Math.floor(screenX - spriteSize / 2);
      const enCol = Math.floor(screenX + spriteSize / 2);
      const animBob = Math.sin(enemy.animPhase) * (enemy.state === 'chase' ? 2 : 0.5);

      for (let col = stCol; col < enCol; col++) {
        if (col < 0 || col >= RW || s.dist >= zBuffer[col]) continue;
        const lx = (col - stCol) / spriteSize;
        const lxAbs = Math.abs(lx - 0.5) * 2;

        if (enemy.state === 'dead') {
          const dp = 1 - enemy.deathTimer / 2.0;
          const collapseH = spriteSize * Math.max(0.1, 1 - dp * 0.9);
          const newY = screenY + spriteSize - collapseH;
          const r = parseInt(enemy.bodyColor.slice(1,3),16);
          const g = parseInt(enemy.bodyColor.slice(3,5),16);
          const b = parseInt(enemy.bodyColor.slice(5,7),16);
          const darkFactor = shade * (1 - dp * 0.7);
          ctx.fillStyle = `rgb(${Math.floor(r*darkFactor)},${Math.floor(Math.min(g*darkFactor, g*darkFactor*0.5))},${Math.floor(Math.min(b*darkFactor, b*darkFactor*0.5))})`;
          ctx.fillRect(col, newY, 1, collapseH);
          if (dp > 0.3 && lxAbs < 0.5) {
            ctx.fillStyle = `rgba(100,0,0,${dp * 0.5 * shade})`;
            ctx.fillRect(col, newY + collapseH * 0.3, 1, collapseH * 0.4);
          }
          continue;
        }

        if (enemy.type === 'cacodemon') {
          const dist2center = lxAbs;
          const circleEdge = Math.sqrt(Math.max(0, 1 - dist2center * dist2center * 1.5));
          if (circleEdge < 0.2) continue;
          const bodyShade = shade * (0.7 + circleEdge * 0.3);
          ctx.fillStyle = enemy.painTimer > 0 ? '#FFFFFF' : shadeColor(enemy.bodyColor, bodyShade);
          const bodyH = spriteSize * circleEdge;
          const bodyY = screenY + (spriteSize - bodyH) / 2 + animBob;
          ctx.fillRect(col, bodyY, 1, bodyH);
          if (lx > 0.35 && lx < 0.65) {
            const eyeY = bodyY + bodyH * 0.25;
            const eyeH = Math.max(2, bodyH * 0.15);
            ctx.fillStyle = enemy.painTimer > 0 ? '#FF0000' : enemy.eyeColor;
            ctx.fillRect(col, eyeY, 1, eyeH);
            if (lx > 0.42 && lx < 0.58) {
              ctx.fillStyle = '#000';
              ctx.fillRect(col, eyeY + 1, 1, Math.max(1, eyeH - 2));
            }
          }
          if (lx > 0.3 && lx < 0.7 && dist2center > 0.2) {
            ctx.fillStyle = shadeColor(enemy.bodyColor, bodyShade * 0.6);
            ctx.fillRect(col, bodyY + bodyH * 0.65, 1, bodyH * 0.1);
          }
        } else {
          if (lxAbs > 0.65) continue;
          const isPain = enemy.painTimer > 0;

          const headW = 0.45;
          const shoulderW = 0.65;
          const waistW = 0.5;
          let inBody = false;

          if (lxAbs < headW * (enemy.type === 'baron' ? 1.1 : 1)) {
            ctx.fillStyle = isPain ? '#FFFFFF' : shadeColor(enemy.skinTone, shade);
            ctx.fillRect(col, screenY + animBob, 1, spriteSize * 0.3);
            inBody = true;

            if (enemy.type === 'imp' || enemy.type === 'baron') {
              if (lxAbs > 0.15 && lxAbs < 0.35) {
                ctx.fillStyle = shadeColor(enemy.hornColor, shade);
                ctx.fillRect(col, screenY - spriteSize * 0.08 + animBob, 1, spriteSize * 0.1);
              }
            }

            if ((lx > 0.3 && lx < 0.42) || (lx > 0.58 && lx < 0.7)) {
              const eyeY = screenY + spriteSize * 0.1 + animBob;
              const eyeH = Math.max(2, spriteSize * 0.07);
              ctx.fillStyle = isPain ? '#FF0000' : enemy.eyeColor;
              ctx.fillRect(col, eyeY, 1, eyeH);
            }
            if (lx > 0.42 && lx < 0.58) {
              ctx.fillStyle = shadeColor(enemy.skinTone, shade * 0.7);
              ctx.fillRect(col, screenY + spriteSize * 0.18 + animBob, 1, spriteSize * 0.06);
            }
          }

          if (lxAbs < shoulderW) {
            ctx.fillStyle = isPain ? '#DDDDDD' : shadeColor(enemy.bodyColor, shade * 0.9);
            ctx.fillRect(col, screenY + spriteSize * 0.3 + animBob, 1, spriteSize * 0.35);
            inBody = true;
          }

          if (lxAbs < waistW) {
            ctx.fillStyle = isPain ? '#CCCCCC' : shadeColor(enemy.bodyColor, shade * 0.7);
            ctx.fillRect(col, screenY + spriteSize * 0.65 + animBob, 1, spriteSize * 0.35);
            inBody = true;
          }

          if (!inBody) continue;
        }
      }
      continue;
    }

    if (s.type === 'pickup') {
      const pickup = s.data;
      const pBob = Math.sin(pickup.bobPhase) * 0.08;
      const spriteSize = Math.floor(RH / s.dist * 0.28);
      if (spriteSize < 2) continue;
      const screenY = halfH - spriteSize / 2 + bobY + shakeY + pBob * spriteSize;

      let pickupColor, glowColor;
      switch (pickup.type) {
        case 'health': pickupColor = '#CC0000'; glowColor = 'rgba(255,0,0,'; break;
        case 'megahealth': pickupColor = '#FF2200'; glowColor = 'rgba(255,100,0,'; break;
        case 'armor': pickupColor = '#0066CC'; glowColor = 'rgba(0,100,255,'; break;
        case 'ammo_bullets': pickupColor = '#BB8800'; glowColor = 'rgba(200,150,0,'; break;
        case 'ammo_shells': pickupColor = '#CC5500'; glowColor = 'rgba(200,80,0,'; break;
        case 'ammo_cells': pickupColor = '#0099CC'; glowColor = 'rgba(0,180,255,'; break;
        case 'shotgun': pickupColor = '#886633'; glowColor = 'rgba(150,100,50,'; break;
        case 'plasma': pickupColor = '#3344AA'; glowColor = 'rgba(50,80,200,'; break;
        default: pickupColor = '#AAAAAA'; glowColor = 'rgba(150,150,150,';
      }

      const stCol = Math.floor(screenX - spriteSize / 2);
      const enCol = Math.floor(screenX + spriteSize / 2);
      const glow = 0.15 + 0.1 * Math.sin(pickup.bobPhase * 2);
      for (let col = stCol - 2; col < enCol + 2; col++) {
        if (col < 0 || col >= RW || s.dist >= zBuffer[col]) continue;
        const lx = Math.abs((col - stCol) / spriteSize - 0.5) * 2;
        if (lx > 0.9) {
          ctx.fillStyle = glowColor + (glow * shade * (1 - lx)) + ')';
          ctx.fillRect(col, screenY - 1, 1, spriteSize + 2);
        } else if (lx > 0.6) continue;
        else {
          ctx.fillStyle = shadeColor(pickupColor, shade);
          ctx.fillRect(col, screenY, 1, spriteSize);
          ctx.fillStyle = `rgba(255,255,255,${0.2 * shade})`;
          ctx.fillRect(col, screenY, 1, Math.max(1, spriteSize * 0.2));
        }
      }
    }
  }

  if (muzzleFlash > 0) {
    const weapon = WEAPONS[player.currentWeapon];
    ctx.globalAlpha = muzzleFlash * 4;
    ctx.fillStyle = weapon.projectileColor;
    const flashSize = RW * 0.12;
    ctx.fillRect(RW / 2 - flashSize / 2, RH * 0.52 - flashSize, flashSize, flashSize);
    ctx.globalAlpha = muzzleFlash * 2;
    ctx.fillStyle = '#FFFFFF';
    const coreSize = flashSize * 0.4;
    ctx.fillRect(RW / 2 - coreSize / 2, RH * 0.52 - flashSize + (flashSize - coreSize) / 2, coreSize, coreSize);
    ctx.globalAlpha = 1;
  }

  drawWeapon();
  drawHUD();
  drawNotifications();

  if (damageFlash > 0) {
    ctx.globalAlpha = damageFlash * 0.5;
    ctx.fillStyle = '#CC0000';
    ctx.fillRect(0, 0, RW, RH);

    let dirAngle = damageDir;
    while (dirAngle > Math.PI) dirAngle -= TWO_PI;
    while (dirAngle < -Math.PI) dirAngle += TWO_PI;
    const indicatorX = RW / 2 + Math.cos(dirAngle) * RW * 0.35;
    const indicatorY = RH / 2 + Math.sin(dirAngle) * RH * 0.35;
    ctx.globalAlpha = damageFlash * 0.7;
    ctx.fillStyle = '#FF0000';
    ctx.beginPath();
    ctx.arc(indicatorX, indicatorY, 6, 0, TWO_PI);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (pickupFlash > 0) {
    ctx.globalAlpha = pickupFlash * 0.15;
    ctx.fillStyle = '#DDCC00';
    ctx.fillRect(0, 0, RW, RH);
    ctx.globalAlpha = 1;
  }

  if (heartbeatPhase > 0.05) {
    ctx.globalAlpha = heartbeatPhase * 0.25;
    ctx.fillStyle = '#440000';
    ctx.fillRect(0, 0, RW, RH);
    ctx.globalAlpha = 1;
  }

  if (gameState === STATES.GAME_OVER) {
    ctx.globalAlpha = Math.min(0.8, (performance.now() - levelStartTime) * 0.001);
    ctx.fillStyle = '#200000';
    ctx.fillRect(0, 0, RW, RH);
    ctx.globalAlpha = 1;
  }
}

function drawWeapon() {
  const weapon = WEAPONS[player.currentWeapon];
  const bob = Math.sin(weaponBob) * 2.5 * headBobIntensity;
  const bobVert = Math.abs(Math.cos(weaponBob)) * 1.5 * headBobIntensity;
  const kick = weaponKick * 15;
  const w = RW * 0.22;
  const h = RH * 0.25;
  const x = RW / 2 - w / 2 + bob;
  const y = RH - h - Math.floor(RH * 0.12) + kick + bobVert;

  ctx.fillStyle = shadeColor(weapon.barrelColor, 0.8);
  ctx.fillRect(x + w * 0.42, y - h * 0.1, w * 0.16, h * 0.3);

  ctx.fillStyle = weapon.color;
  ctx.fillRect(x + w * 0.3, y + h * 0.15, w * 0.4, h * 0.6);

  ctx.fillStyle = shadeColor(weapon.color, 1.15);
  ctx.fillRect(x + w * 0.32, y + h * 0.18, w * 0.36, h * 0.08);

  ctx.fillStyle = shadeColor(weapon.color, 0.6);
  ctx.fillRect(x + w * 0.3, y + h * 0.6, w * 0.4, h * 0.15);

  ctx.fillStyle = shadeColor(weapon.barrelColor, 0.5);
  ctx.fillRect(x + w * 0.15, y + h * 0.55, w * 0.25, h * 0.35);
  ctx.fillRect(x + w * 0.6, y + h * 0.55, w * 0.25, h * 0.35);

  ctx.fillStyle = '#111';
  ctx.fillRect(x + w * 0.45, y - h * 0.1, w * 0.1, h * 0.05);

  if (player.currentWeapon === 2) {
    const glowI = 0.3 + 0.2 * Math.sin(gameTime * 8);
    ctx.fillStyle = `rgba(0,150,255,${glowI})`;
    ctx.fillRect(x + w * 0.35, y + h * 0.2, w * 0.3, h * 0.03);
    ctx.fillRect(x + w * 0.35, y + h * 0.35, w * 0.3, h * 0.03);
  }
}

function drawHUD() {
  const hudH = Math.floor(RH * 0.12);
  const hudY = RH - hudH;

  const hudGrad = ctx.createLinearGradient(0, hudY, 0, RH);
  hudGrad.addColorStop(0, 'rgba(25, 12, 8, 0.92)');
  hudGrad.addColorStop(1, 'rgba(15, 8, 4, 0.95)');
  ctx.fillStyle = hudGrad;
  ctx.fillRect(0, hudY, RW, hudH);

  ctx.fillStyle = '#442200';
  ctx.fillRect(0, hudY, RW, 1);
  ctx.fillStyle = 'rgba(80,40,10,0.3)';
  ctx.fillRect(0, hudY + 1, RW, 1);

  const fontSize = Math.max(6, Math.floor(hudH * 0.32));
  ctx.font = `bold ${fontSize}px monospace`;
  ctx.textAlign = 'center';

  const weapon = WEAPONS[player.currentWeapon];
  const ammoCount = player.ammo[weapon.ammoType];
  const section = RW / 4;

  const hpLow = player.health <= 25;
  const hpFlicker = hpLow ? (Math.sin(gameTime * 10) > 0 ? 1 : 0.5) : 1;
  ctx.fillStyle = hpLow ? `rgba(255,0,0,${hpFlicker})` : '#CC3333';
  ctx.fillText(`${player.health}`, section * 0.5, hudY + hudH * 0.42);
  ctx.font = `${Math.max(4, fontSize - 2)}px monospace`;
  ctx.fillStyle = '#664433';
  ctx.fillText('HEALTH', section * 0.5, hudY + hudH * 0.65);

  const hpBarW = section * 0.7;
  const hpBarH = Math.max(2, hudH * 0.12);
  const hpBarX = section * 0.5 - hpBarW / 2;
  const hpBarY = hudY + hudH * 0.72;
  ctx.fillStyle = '#1A0000';
  ctx.fillRect(hpBarX, hpBarY, hpBarW, hpBarH);
  const hpPct = Math.min(1, player.health / 100);
  ctx.fillStyle = hpLow ? `rgb(200,0,0)` : `rgb(${Math.floor(200 - hpPct * 80)},${Math.floor(hpPct * 60)},0)`;
  ctx.fillRect(hpBarX, hpBarY, hpBarW * hpPct, hpBarH);

  ctx.font = `bold ${fontSize}px monospace`;
  ctx.fillStyle = '#3377CC';
  ctx.fillText(`${player.armor}`, section * 1.5, hudY + hudH * 0.42);
  ctx.font = `${Math.max(4, fontSize - 2)}px monospace`;
  ctx.fillStyle = '#334466';
  ctx.fillText('ARMOR', section * 1.5, hudY + hudH * 0.65);
  const arBarW = section * 0.7;
  const arBarX = section * 1.5 - arBarW / 2;
  ctx.fillStyle = '#000a1a';
  ctx.fillRect(arBarX, hpBarY, arBarW, hpBarH);
  ctx.fillStyle = '#3377CC';
  ctx.fillRect(arBarX, hpBarY, arBarW * Math.min(1, player.armor / 100), hpBarH);

  const ammoLow = ammoCount <= 5;
  const ammoFlash = ammoLow ? (Math.sin(gameTime * 8) > 0 ? 1 : 0.6) : 1;
  ctx.font = `bold ${fontSize}px monospace`;
  ctx.fillStyle = ammoLow ? `rgba(255,100,0,${ammoFlash})` : '#CCAA44';
  ctx.fillText(`${ammoCount}`, section * 2.5, hudY + hudH * 0.42);
  ctx.font = `${Math.max(4, fontSize - 2)}px monospace`;
  ctx.fillStyle = '#665533';
  ctx.fillText(weapon.name, section * 2.5, hudY + hudH * 0.65);

  const wpnBtnSize = Math.max(8, Math.floor(hudH * 0.45));
  const wpnBtnY = hudY + (hudH - wpnBtnSize) / 2;
  canvas._weaponBtns = [];
  for (let i = 0; i < 3; i++) {
    const btnX = section * 3.2 + i * (wpnBtnSize + 2);
    const isActive = i === player.currentWeapon;
    const hasWeapon = player.weapons[i];
    ctx.fillStyle = hasWeapon ? (isActive ? '#664400' : '#221100') : '#0a0a0a';
    ctx.fillRect(btnX, wpnBtnY, wpnBtnSize, wpnBtnSize);
    if (isActive && hasWeapon) {
      ctx.fillStyle = 'rgba(255,170,0,0.15)';
      ctx.fillRect(btnX, wpnBtnY, wpnBtnSize, wpnBtnSize);
    }
    ctx.fillStyle = hasWeapon ? (isActive ? '#FFCC00' : '#886633') : '#222';
    ctx.font = `bold ${Math.floor(wpnBtnSize * 0.55)}px monospace`;
    ctx.fillText(`${i + 1}`, btnX + wpnBtnSize / 2, wpnBtnY + wpnBtnSize * 0.68);

    const screenBtnX = btnX / RENDER_SCALE;
    const screenBtnY = wpnBtnY / RENDER_SCALE;
    canvas._weaponBtns.push({ x: screenBtnX, y: screenBtnY, w: Math.max(24, wpnBtnSize * 3), h: Math.max(24, wpnBtnSize * 3), idx: i });
  }

  ctx.font = `${Math.max(4, fontSize - 3)}px monospace`;
  ctx.fillStyle = '#444';
  ctx.textAlign = 'right';
  ctx.fillText(`${kills}/${totalKills}`, RW - 4, hudY - 4);

  drawMinimap();
}

canvas.addEventListener('touchstart', (e) => {
  if (!canvas._weaponBtns) return;
  for (const t of e.changedTouches) {
    for (const btn of canvas._weaponBtns) {
      if (t.clientX >= btn.x && t.clientX <= btn.x + btn.w &&
          t.clientY >= btn.y && t.clientY <= btn.y + btn.h) {
        switchWeapon(btn.idx);
      }
    }
  }
}, { passive: true });

function drawNotifications() {
  if (notifications.length === 0) return;
  const fontSize = Math.max(5, Math.floor(RH * 0.025));
  ctx.textAlign = 'center';

  for (let i = 0; i < notifications.length; i++) {
    const n = notifications[i];
    const alpha = Math.min(1, n.life / (n.maxLife * 0.3));
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${fontSize}px monospace`;
    ctx.fillStyle = '#000';
    ctx.fillText(n.text, RW / 2 + 1, RH * 0.22 + i * (fontSize + 3) + 1);
    ctx.fillStyle = n.color;
    ctx.fillText(n.text, RW / 2, RH * 0.22 + i * (fontSize + 3));
  }
  ctx.globalAlpha = 1;
}

function drawMinimap() {
  const grid = LEVELS[currentLevel].grid;
  const mapH = grid.length, mapW = grid[0].length;
  const cellSize = Math.max(2, Math.floor(Math.min(RW * 0.07 / mapW, RH * 0.12 / mapH)));
  const mmW = mapW * cellSize, mmH = mapH * cellSize;
  const mmX = 3, mmY = 3;

  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#000';
  ctx.fillRect(mmX - 1, mmY - 1, mmW + 2, mmH + 2);
  ctx.globalAlpha = 0.4;

  for (let y = 0; y < mapH; y++) {
    for (let x = 0; x < mapW; x++) {
      if (grid[y][x] > 0) {
        const c = WALL_COLORS[grid[y][x]] || WALL_COLORS[1];
        ctx.fillStyle = c.dark;
        ctx.fillRect(mmX + x * cellSize, mmY + y * cellSize, cellSize, cellSize);
      }
    }
  }

  for (const enemy of enemies) {
    if (!enemy.active || enemy.state === 'dead') continue;
    ctx.fillStyle = enemy.state === 'chase' ? '#FF0000' : '#880000';
    ctx.fillRect(mmX + enemy.x * cellSize - 1, mmY + enemy.y * cellSize - 1, 2, 2);
  }
  for (const pickup of pickups) {
    if (!pickup.active) continue;
    ctx.fillStyle = '#CCAA00';
    ctx.fillRect(mmX + pickup.x * cellSize, mmY + pickup.y * cellSize, 1, 1);
  }
  const exitDef = LEVELS[currentLevel].exit;
  if (exitDef) {
    const ep = 0.5 + 0.5 * Math.sin(gameTime * 3);
    ctx.fillStyle = `rgba(0,255,80,${0.4 + ep * 0.4})`;
    ctx.fillRect(mmX + (exitDef.x + 0.5) * cellSize - 1, mmY + (exitDef.y + 0.5) * cellSize - 1, 3, 3);
  }
  ctx.fillStyle = '#00FF00';
  const px = mmX + player.x * cellSize, py = mmY + player.y * cellSize;
  ctx.fillRect(px - 1, py - 1, 3, 3);
  ctx.strokeStyle = '#00CC00';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(player.angle) * cellSize * 2, py + Math.sin(player.angle) * cellSize * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function shadeColor(hex, factor) {
  const r = Math.floor(parseInt(hex.slice(1,3),16) * factor);
  const g = Math.floor(parseInt(hex.slice(3,5),16) * factor);
  const b = Math.floor(parseInt(hex.slice(5,7),16) * factor);
  return `rgb(${Math.min(255,r)},${Math.min(255,g)},${Math.min(255,b)})`;
}

let lastTime = performance.now();
function gameLoop(timestamp) {
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
